<!-- Atalho para quem navega por teclado / leitor de tela -->
<button type="button" class="pular-conteudo" (click)="conteudo.focus()">
    Pular para o conteúdo
</button>

<header class="cabecalho">

    <div class="container">

        <div class="header-principal">

            <!-- Logo e nome -->
            <div class="marca">
                <img
                    src="logotipo.png"
                    id="logotipo"
                    alt="Caminhos do Brasil">

                <span>Caminhos do Brasil</span>
            </div>


            <!-- Barra de pesquisa -->
            <div class="busca">
                <app-busca></app-busca>
            </div>
           <!-- Links -->
            <button routerLink="/login" class="btn-entrar">
                Entrar
            </button>

        </div>


        <!-- Menu inferior -->
        <nav class="menu-inferior" aria-label="Menu principal">

            <a routerLink="/">Início</a>
            <a routerLink="/cesta">Cesta</a>
            <a routerLink="/destaque">Destaques</a>
            <a routerLink="/sobrenos">Sobre nós</a>


        </nav>

    </div>

</header>
<main #conteudo class="conteudo" tabindex="-1">
   <router-outlet></router-outlet>
</main>


<footer class="rodape text-center py-3">

    <h5>Caminhos do Brasil</h5>

    <p class="mb-1">Entre em contato: saccaminhos@gmail.com</p>

    <p class="mb-1">Telefone: (11) 93455-1288</p>

    <p class="mb-1">Instagram: @caminhosdoBrasil</p>

    <p class="mt-3 mb-0">
        © 2026 Caminhos do Brasil
    </p>

</footer>

<app-acessibilidade />
